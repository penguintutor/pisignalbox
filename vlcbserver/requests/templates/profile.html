<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi SignalBox</title>
    <link rel="stylesheet" href="{{ url_for('web.static', filename='pisignalbox.css') }}" />
</head>
<body>

    <header class="top-bar">
        
        <div class="layout-selector">
            <label for="layout"><strong>Layout:</strong></label>
            <select id="layout" name="layout">
                <option value="garden_g_scale">Garden G-Scale</option>
                <option value="indoor_oo_scale">Indoor OO-Scale</option>
                <option value="test_track">Test Track</option>
            </select>
        </div>

        <div class="user-menu">
            <button class="user-button">
                👤 stewart_w ▼
            </button>
            <div class="dropdown-content">
                <a href="/profile">User Profile</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </header>

    <main>
        <div class="banner-container">
            <img src="{{ url_for('web.static', filename='pisignalbox-banner-small-01.png') }}" alt="Pi SignalBox - Python GUI / Virtual Signal Box / Loco Control / Automation">
        </div>

        <div class="app-nav">
            <a href="/train-controller" class="nav-card">
                Train Controller
            </a>
            
            <a href="/track-view" class="nav-card">
                Track View
            </a>
            
            <a href="/nodes" class="nav-card">
                Nodes 
                <span style="font-size: 14px; font-weight: normal; color: #666; margin-top: 5px;">(Points & Signals)</span>
            </a>
            
            <a href="/manage" class="nav-card">
                Manage Application
                <span style="font-size: 14px; font-weight: normal; color: #666; margin-top: 5px;">(Settings & Users)</span>
            </a>
        </div>
    </main>

<p>Profile</p>

</body>
</html>
