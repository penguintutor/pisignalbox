<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi SignalBox - Login</title>
    <link rel="stylesheet" href="{{ url_for('web.static', filename='pisignalbox.css') }}" />
</head>
<body>

    <header class="top-bar">
        <!-- Simplified top bar for unauthenticated users -->
        <div class="app-title">
            <strong>Pi SignalBox Access</strong>
        </div>
    </header>

    <main>
        <div class="banner-container">
            <img src="{{ url_for('web.static', filename='pisignalbox-banner-small-01.png') }}" alt="Pi SignalBox - Python GUI / Virtual Signal Box / Loco Control / Automation">
        </div>

        <div class="login-wrapper">
            <div class="login-panel">
                <h2>System Login</h2>
                
                <!-- Display Flash Messages (e.g., "Invalid username or password.") -->
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('web.login', next=request.args.get('next')) }}">
                    <!-- Required for Flask-WTF CSRF protection -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="login-btn">Log In</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
