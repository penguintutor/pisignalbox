<div class="card card-body bg-light border-secondary">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="font-monospace text-primary">
            <strong>/{{ current_rel_path }}</strong>
        </span>
        <button type="button" class="btn btn-sm btn-primary" 
                onclick="document.getElementById('gui_path').value = '{{ current_rel_path }}'; document.getElementById('dir-browser-container').innerHTML = '';">
            ✓ Select Directory
        </button>
    </div>
    
    <div class="list-group list-group-flush border" style="max-height: 250px; overflow-y: auto;">
        {% if not is_root %}
        <a href="javascript:void(0)" class="list-group-item list-group-item-action py-2 bg-white fw-bold" 
           hx-get="{{ url_for('admin.browse_dir', path=parent_path) }}" 
           hx-target="#dir-browser-container">
           ⬅️ Up a level (..)
        </a>
        {% endif %}
        
        {% for dir in dirs %}
        <a href="javascript:void(0)" class="list-group-item list-group-item-action py-2 bg-white"
           hx-get="{{ url_for('admin.browse_dir', path=(current_rel_path ~ '/' ~ dir).strip('/')) }}" 
           hx-target="#dir-browser-container">
           📁 {{ dir }}
        </a>
        {% else %}
        <div class="list-group-item text-muted py-2 bg-white"><em>No subdirectories found</em></div>
        {% endfor %}
    </div>

    <div class="mt-3 text-end">
        <button type="button" class="btn btn-sm btn-outline-danger" 
                onclick="document.getElementById('dir-browser-container').innerHTML = '';">
            Close Browser
        </button>
    </div>
</div>
