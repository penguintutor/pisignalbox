<div id="dir-browser-ui" class="card border-secondary shadow-sm">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <span class="font-monospace text-truncate" style="max-width: 70%;">
            <strong>Current:</strong> {{ current_rel_path }}
        </span>
        
        <!-- Safely clears the container without deleting it -->
        <button class="btn btn-sm btn-success" type="button"
                onclick="
                    document.getElementById('gui_settings_path').value = '{{ current_rel_path }}'; 
                    document.getElementById('dir-browser-container').innerHTML = '';
                ">
            Select Directory
        </button>
    </div>
    
    <div class="card-body p-0" style="max-height: 300px; overflow-y: auto;">
        <div class="list-group list-group-flush font-monospace">
            
            <!-- "Up" Directory Button -->
            {% if not is_root %}
            <button type="button" class="list-group-item list-group-item-action bg-light"
                    hx-get="{{ url_for('admin.browse_dir', path=parent_path) }}"
                    hx-target="#dir-browser-container"
                    hx-swap="innerHTML">
                📁 .. (Up)
            </button>
            {% endif %}

            <!-- Subdirectories -->
            {% for d in dirs %}
                {% set next_path = current_rel_path ~ '/' ~ d if current_rel_path else d %}
                
                <button type="button" class="list-group-item list-group-item-action"
                        hx-get="{{ url_for('admin.browse_dir', path=next_path) }}"
                        hx-target="#dir-browser-container"
                        hx-swap="innerHTML">
                    📁 {{ d }}
                </button>
            {% else %}
                <div class="list-group-item text-muted fst-italic">
                    No subdirectories found.
                </div>
            {% endfor %}
            
        </div>
    </div>
</div>
