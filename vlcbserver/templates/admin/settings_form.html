{% from 'macros/shared.html' import render_flashed_messages %}

{{ render_flashed_messages() }}

<form id="app-settings-card" class="card p-4 w-100 shadow-sm border-primary" 
      hx-post="{{ url_for('admin.view_save_settings') }}" 
      hx-target="this" 
      hx-swap="outerHTML">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card-body">
        <h3 class="card-title mb-4 border-bottom pb-2 text-primary">Edit Application Settings</h3>

        <!-- Toggle for Local GUI -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-3 fw-bold">
                <label for="use_gui_settings">Enable Local GUI:</label>
            </div>
            <div class="col-md-9">
                <div class="form-check form-switch fs-5">
                    <input class="form-check-input" type="checkbox" role="switch" 
                        id="use_gui_settings" name="use_gui_settings" 
                        {% if settings.use_gui_settings %}checked aria-checked="true"{% else %}aria-checked="false"{% endif %}
                        onchange="handleGuiSettingsToggle(this);">
                </div>
            </div>
        </div>

        <!-- Path Selection (Conditional Visibility) -->
        <div id="path_selection_container" class="row mb-4 {% if not settings.use_gui_settings %}d-none{% endif %}">
            <div class="col-md-3 fw-bold">
                <label for="gui_settings_path">Local GUI Path:</label>
            </div>
            <div class="col-md-9">
                <div class="input-group mb-1">
                    <input type="text" id="gui_settings_path" name="gui_settings_path" class="form-control font-monospace" 
                           value="{{ settings.gui_settings_path }}" placeholder="e.g., guiclient/data">
                    <button class="btn btn-outline-secondary" type="button" 
                            hx-get="{{ url_for('admin.browse_dir') }}" 
                            hx-target="#dir-browser-container"
                            hx-swap="innerHTML"> <!-- THIS STOPS THE INHERITANCE -->
                        Browse System
                    </button>
                </div>
                <small class="text-muted">Select a directory restricted to the application root.</small>
                
                <!-- Target container for the HTMX Directory Browser -->
                <div id="dir-browser-container" class="mt-3"></div>
            </div>
        </div>

        <!-- Toggle for Server Settings -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-3 fw-bold">
                <label for="use_server_settings">Server Settings (override GUI settings):</label>
            </div>
            <div class="col-md-9">
                <div class="form-check form-switch fs-5">
                    <input class="form-check-input" type="checkbox" role="switch" 
                        id="use_server_settings" name="use_server_settings" 
                        {% if settings.use_server_settings %}checked aria-checked="true"{% else %}aria-checked="false"{% endif %}
                        onchange="handleServerSettingsToggle(this);">
                </div>
            </div>
        </div>

        <!-- Future Setting Placeholder -->
        <div class="row mb-4">
            <div class="col-md-3 fw-bold">
                <label for="future_setting">Future Setting:</label>
            </div>
            <div class="col-md-9">
                <textarea id="future_setting" class="form-control" rows="3" disabled>This placeholder uses a full-width textarea configuration inside a fluid container, explicitly designed to handle paragraphs of settings text without arbitrary line breaks.</textarea>
            </div>
        </div>

        <!-- Actions -->
        <div class="mt-4 pt-2 border-top d-flex gap-2">
            <button type="submit" class="btn btn-success px-4">Save Changes</button>
            <button type="button" class="btn btn-secondary px-4" hx-get="{{ url_for('admin.view_save_settings') }}">
                Cancel
            </button>
        </div>
    </div>

    <script>
        function handleGuiSettingsToggle(checkbox) {
            const isChecked = checkbox.checked;
            const container = document.getElementById('path_selection_container');
            const serverToggle = document.getElementById('use_server_settings');
            
            // Handle visibility of the path selector
            if (isChecked) {
                container.classList.remove('d-none');
            } else {
                container.classList.add('d-none');
                
                // Enforce Server Settings to True if GUI is disabled
                if (!serverToggle.checked) {
                    serverToggle.checked = true;
                    serverToggle.setAttribute('aria-checked', 'true');
                }
            }
            
            // Update aria-checked for accessibility
            checkbox.setAttribute('aria-checked', isChecked ? 'true' : 'false');
        }

        function handleServerSettingsToggle(checkbox) {
            const guiToggle = document.getElementById('use_gui_settings');
            
            // Prevent user from disabling Server Settings if GUI Settings are also disabled
            if (!checkbox.checked && !guiToggle.checked) {
                checkbox.checked = true; // Force it back to checked
            }
            
            // Update aria-checked for accessibility
            checkbox.setAttribute('aria-checked', checkbox.checked ? 'true' : 'false');
        }
    </script>
</form>
