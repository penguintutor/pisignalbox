{% extends "base.html" %} <!-- Adjust this to match your base template -->

{% block content %}
<div class="container mt-4">
    <div id="change-password-card" class="card p-3 mx-auto" style="max-width: 500px;">
        <h4 class="mb-4">Change Password</h4>
        
        <form method="POST" action="{{ url_for('home.change_password') }}">
            <!-- CSRF Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Current Password -->
            <div class="mb-3">
                <label for="current_password" class="form-label"><strong>Current Password:</strong></label>
                <input type="password" id="current_password" name="current_password" class="form-control" required>
            </div>
            
            <!-- New Password -->
            <div class="mb-3">
                <label for="new_password" class="form-label"><strong>New Password:</strong></label>
                <input type="password" id="new_password" name="new_password" 
                    placeholder="Enter password" 
                    minlength="{{ User.MIN_LEN_PASSWORD }}" maxlength="{{ User.MAX_LEN_PASSWORD }}" 
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).+" 
                    title="Password must contain at least one number, one uppercase letter, and one lowercase letter."
                    class="form-control" required>
                    <small id="password-help" class="form-hint"></small>
            </div>

            <!-- Confirm New Password -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label"><strong>Confirm New Password:</strong></label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            
            <!-- Actions -->
            <div class="d-flex justify-content-between mt-2">
                <!-- Assuming 'home.profile' is the route for the page containing the profile card -->
                <a href="{{ url_for('home.profile') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
